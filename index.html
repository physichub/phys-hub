<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика | Школьный курс</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 3D Библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            blue: '#0ea5e9',
                            dark: '#0f172a',
                            card: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        
        #particles-js {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1;
            background: radial-gradient(ellipse at top right, #1e293b, #0f172a, #000000);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .glass-card-inner { transform: translateZ(30px); }
        .formula-box {
            background: rgba(0, 0, 0, 0.4); border-left: 4px solid #0ea5e9;
            transform: translateZ(40px); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .example-box {
            background: rgba(15, 23, 42, 0.7); border-top: 2px solid #10b981; transform: translateZ(20px);
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        /* Контейнер для 3D моделей */
        #model-3d-container {
            width: 100%; height: 250px; display: flex; justify-content: center; align-items: center; pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden selection:bg-brand-blue selection:text-white">

    <!-- 3D ФОН -->
    <div id="particles-js"></div>

    <!-- Навигация -->
    <nav class="w-full p-6 flex justify-between items-center relative z-50">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-brand-blue drop-shadow-[0_0_10px_rgba(14,165,233,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
            <span class="text-2xl font-bold tracking-tight text-white drop-shadow-md">Phys<span class="text-brand-blue">Hub</span></span>
        </div>
    </nav>

    <!-- Главный экран -->
    <main class="container mx-auto px-6 pt-10 pb-20 relative z-10">
        <div class="text-center max-w-3xl mx-auto mb-10 relative">
            <p class="font-mono text-sm italic text-slate-400 opacity-80 absolute -top-8 left-1/2 transform -translate-x-1/2">by sahar²¹</p>
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight text-white drop-shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
                Школьный курс <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_15px_rgba(14,165,233,0.5)]">Физики</span>
            </h1>
        </div>

        <!-- Кнопки выбора класса -->
        <div class="flex flex-wrap justify-center gap-3 mb-6 relative z-20">
            <button id="btn-7" onclick="loadClass(7)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">7 класс</button>
            <button id="btn-8" onclick="loadClass(8)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">8 класс</button>
            <button id="btn-9" onclick="loadClass(9)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">9 класс</button>
            <button id="btn-10" onclick="loadClass(10)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">10 класс</button>
            <button id="btn-11" onclick="loadClass(11)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">11 класс</button>
        </div>

        <!-- Контейнер для 3D Голограммы -->
        <div id="model-3d-container" class="drop-shadow-[0_0_25px_rgba(14,165,233,0.6)]"></div>

        <!-- Контейнер для вывода тем -->
        <div id="content-area" class="max-w-5xl mx-auto relative z-10">
            <div class="text-center text-slate-400 py-10 bg-black/20 rounded-xl backdrop-blur-md border border-white/5">Выберите класс для загрузки материалов и 3D-модели.</div>
        </div>
    </main>

    <!-- Скрипты -->
    <script>
        // БАЗА ДАННЫХ
        const physicsData = {
            7: { title: "7 класс: Механика", topics: [{ name: "Плотность вещества", desc: "Масса в единице объема.", formula: "ρ = m / V", vars: "ρ — плотность, m — масса, V — объем", example: { dano: "m = 400 кг, V = 0.5 м³", sol: "ρ = 400 / 0.5 = 800", ans: "800 кг/м³" } }, { name: "Сила тяжести", desc: "Сила притяжения к Земле.", formula: "F = m · g", vars: "g ≈ 9.8 Н/кг", example: { dano: "m = 5 кг", sol: "F = 5 · 10 = 50", ans: "50 Н" } }, { name: "Сила упругости", desc: "Возникает при деформации.", formula: "F = k · Δl", vars: "k — жесткость", example: { dano: "k = 100, Δl = 0.2", sol: "F = 100 · 0.2", ans: "20 Н" } }, { name: "Механическая работа", desc: "Совершается при перемещении тела силой.", formula: "A = F · s", vars: "A — работа", example: { dano: "F = 50, s = 4", sol: "A = 50 · 4", ans: "200 Дж" } }] },
            8: { title: "8 класс: Теплота и электричество", topics: [{ name: "Количество теплоты", desc: "Энергия нагревания.", formula: "Q = c · m · Δt", vars: "c — теплоемкость", example: { dano: "c = 4200, m = 2, Δt = 50", sol: "Q = 4200·2·50", ans: "420 кДж" } }, { name: "Закон Ома", desc: "Связь тока, напряжения и сопротивления.", formula: "I = U / R", vars: "I — ток, U — напряжение", example: { dano: "U = 220, R = 55", sol: "I = 220 / 55", ans: "4 А" } }, { name: "Работа тока", desc: "Энергия тока.", formula: "A = U · I · t", vars: "t — время", example: { dano: "U = 12, I = 2, t = 60", sol: "A = 12·2·60", ans: "1440 Дж" } }] },
            9: { title: "9 класс: Кинематика и Динамика", topics: [{ name: "Ускорение", desc: "Быстрота изменения скорости.", formula: "a = (v - v_0) / t", vars: "a — ускорение", example: { dano: "v_0=0, v=20, t=5", sol: "a = 20/5", ans: "4 м/с²" } }, { name: "Проекция перемещения", desc: "Путь при ускорении.", formula: "s = v_0·t + (a·t²)/2", vars: "s — путь", example: { dano: "v_0=2, a=1, t=4", sol: "s = 8 + 16/2", ans: "16 м" } }, { name: "2 закон Ньютона", desc: "Связь силы и массы.", formula: "F = m · a", vars: "F — сила", example: { dano: "m=5, a=2", sol: "F = 5·2", ans: "10 Н" } }, { name: "Закон сохранения импульса", desc: "Импульс системы сохраняется.", formula: "m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'", vars: "Сумма до = сумма после", example: { dano: "m₁=1, v₁=2; m₂=2, v₂=0", sol: "2 = 3·v'", ans: "0.67 м/с" } }] },
            10: { title: "10 класс: МКТ и Газы", topics: [{ name: "Уравнение Менделеева-Клапейрона", desc: "Состояние газа.", formula: "p · V = (m / M) · R · T", vars: "R - газовая постоянная", example: { dano: "p=10⁵, V=0.083, T=300", sol: "ν = pV/RT", ans: "3.3 моль" } }, { name: "Закон Кулона", desc: "Взаимодействие зарядов.", formula: "F = k · (|q₁| · |q₂|) / r²", vars: "k — коэффициент", example: { dano: "q₁,q₂=3·10⁻⁶, r=0.1", sol: "F = 9·10⁹·9·10⁻¹²/0.01", ans: "8.1 Н" } }] },
            11: { title: "11 класс: Квантовая физика", topics: [{ name: "Магнитный поток", desc: "Линии магнитной индукции.", formula: "Φ = B · S · cos(α)", vars: "B — индукция", example: { dano: "B = 0.2, S = 0.5", sol: "Φ = 0.2·0.5·1", ans: "0.1 Вб" } }, { name: "Энергия фотона", desc: "Энергия кванта света.", formula: "E = h · ν", vars: "h — постоянная Планка", example: { dano: "ν = 5·10¹⁴", sol: "E = 6.6·10⁻³⁴·5·10¹⁴", ans: "3.3·10⁻¹⁹ Дж" } }, { name: "Связь массы и энергии", desc: "Формула Эйнштейна.", formula: "E = m · c²", vars: "c — скорость света", example: { dano: "m = 1", sol: "E = 1·(3·10⁸)²", ans: "9·10¹⁶ Дж" } }] }
        };

        // --- ЛОГИКА 3D ФОНА ---
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50 }, "color": { "value": "#0ea5e9" }, "shape": { "type": "circle" },
                "opacity": { "value": 0.4 }, "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#0ea5e9", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } } }
        });

        // --- ЛОГИКА 3D ГОЛОГРАММ (Three.js) ---
        let scene, camera, renderer, currentMesh;

        function init3D() {
            const container = document.getElementById('model-3d-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            camera.position.z = 6;
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(250, 250);
            container.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0x0ea5e9, 2, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (currentMesh) {
                currentMesh.rotation.x += 0.01;
                currentMesh.rotation.y += 0.015;
            }
            renderer.render(scene, camera);
        }

        function spawn3DModel(grade) {
            if (!scene) init3D();
            
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            let geometry;
            if (grade === 7) geometry = new THREE.BoxGeometry(2.5, 2.5, 2.5); // Куб
            else if (grade === 8) geometry = new THREE.TorusGeometry(1.5, 0.6, 16, 50); // Кольцо/Тор
            else if (grade === 9) geometry = new THREE.ConeGeometry(2, 3, 16); // Конус
            else if (grade === 10) geometry = new THREE.SphereGeometry(2, 16, 16); // Сфера
            else if (grade === 11) geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 64, 16); // Узел связи

            const material = new THREE.MeshStandardMaterial({
                color: 0x0ea5e9, wireframe: true, emissive: 0x0ea5e9, emissiveIntensity: 0.8
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        // --- ЛОГИКА ОТРИСОВКИ ---
        function loadClass(grade) {
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-brand-blue', 'text-white', 'shadow-[0_0_20px_rgba(14,165,233,0.8)]');
                btn.classList.add('bg-white/5', 'text-slate-300');
            });
            const clickedBtn = document.getElementById('btn-' + grade);
            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white/5', 'text-slate-300');
                clickedBtn.classList.add('bg-brand-blue', 'text-white', 'shadow-[0_0_20px_rgba(14,165,233,0.8)]');
            }

            spawn3DModel(grade);

            const data = physicsData[grade];
            const contentArea = document.getElementById('content-area');
            let html = `<div class="fade-in mb-8 text-center md:text-left"><h2 class="text-3xl font-bold text-white border-b border-white/10 pb-4 inline-block drop-shadow-md">${data.title}</h2></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-8 pb-10">`;

            data.topics.forEach((topic, index) => {
                let exampleHtml = '';
                if (topic.example) {
                    exampleHtml = `
                        <div class="example-box mt-5 p-4 rounded-lg shadow-inner">
                            <h4 class="text-xs text-emerald-400 font-bold mb-3 uppercase flex items-center gap-2">Пример решения</h4>
                            <div class="flex flex-col gap-2 text-sm font-mono text-slate-300">
                                <p><span class="text-slate-500">Дано:</span> ${topic.example.dano}</p>
                                <p><span class="text-slate-500">Решение:</span> ${topic.example.sol}</p>
                                <p class="text-brand-blue font-bold bg-brand-blue/20 inline-block px-2 py-1 rounded w-max">Ответ: ${topic.example.ans}</p>
                            </div>
                        </div>`;
                }
                html += `
                    <div class="glass-card vanilla-tilt-card rounded-2xl p-6 fade-in flex flex-col justify-between" style="animation-delay: ${index * 0.1}s">
                        <div class="glass-card-inner">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue font-bold shadow-[0_0_15px_rgba(14,165,233,0.3)] shrink-0">${index + 1}</div>
                                <h3 class="text-xl font-bold text-white drop-shadow-md">${topic.name}</h3>
                            </div>
                            <p class="text-slate-300 mb-5 text-sm drop-shadow-sm">${topic.desc}</p>
                            <div class="formula-box p-4 rounded-lg">
                                <span class="text-xs text-brand-blue font-bold uppercase mb-1 block">Формула</span>
                                <code class="font-mono text-xl text-emerald-400 block mb-2 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">${topic.formula}</code>
                                <p class="font-mono text-xs text-slate-400 border-t border-white/10 pt-2">${topic.vars}</p>
                            </div>
                        </div>
                        ${exampleHtml}
                    </div>`;
            });
            html += `</div>`;
            contentArea.innerHTML = html;

            setTimeout(() => {
                VanillaTilt.init(document.querySelectorAll(".vanilla-tilt-card"), {
                    max: 8, speed: 400, glare: true, "max-glare": 0.2, scale: 1.02
                });
            }, 100);
        }
    </script>
</body>
</html>
