<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика | Школьный курс</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            blue: '#0ea5e9',
                            dark: '#0f172a',
                            card: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Эффект стекла и анимации */
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.4);
            box-shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.2);
        }
        .formula-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #0ea5e9;
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-brand-dark to-black overflow-x-hidden selection:bg-brand-blue selection:text-white">

    <!-- Навигация -->
    <nav class="w-full p-6 flex justify-between items-center relative z-50">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
            <span class="text-2xl font-bold tracking-tight">Phys<span class="text-brand-blue">Hub</span></span>
        </div>
    </nav>

    <!-- Главный экран -->
    <main class="container mx-auto px-6 pt-10 pb-20">
        <div class="text-center max-w-3xl mx-auto mb-16 relative">
            <p class="font-mono text-sm italic text-slate-400 opacity-60 hover:opacity-100 hover:text-brand-blue transition-all duration-300 absolute -top-8 left-1/2 transform -translate-x-1/2 cursor-default">
                by sahar²¹
            </p>
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight leading-tight">
                Школьный курс <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Физики</span>
            </h1>
            <p class="text-lg text-slate-400">Выберите класс, чтобы открыть темы, понятные объяснения и формулы.</p>
        </div>

        <!-- Кнопки выбора класса с ID -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="class-buttons">
            <button id="btn-7" onclick="loadClass(7)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">7 класс</button>
            <button id="btn-8" onclick="loadClass(8)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">8 класс</button>
            <button id="btn-9" onclick="loadClass(9)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">9 класс</button>
            <button id="btn-10" onclick="loadClass(10)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">10 класс</button>
            <button id="btn-11" onclick="loadClass(11)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">11 класс</button>
        </div>

        <!-- Контейнер для вывода тем -->
        <div id="content-area" class="max-w-5xl mx-auto">
            <div class="text-center text-slate-500 py-10">Нажмите на нужный класс выше, чтобы загрузить материалы.</div>
        </div>
    </main>

    <!-- Скрипт с данными и логикой -->
    <script>
        // База данных по всем классам
        const physicsData = {
            7: {
                title: "7 класс: Первое знакомство и основы механики",
                topics: [
                    {
                        name: "Плотность вещества",
                        desc: "Плотность показывает, какая масса вещества содержится в единице объема. Например, кубик железа тяжелее кубика дерева такого же размера.",
                        formula: "ρ = m / V",
                        vars: "ρ — плотность, m — масса, V — объем"
                    },
                    {
                        name: "Сила тяжести",
                        desc: "Сила, с которой Земля (или другая планета) притягивает к себе все тела. Она всегда направлена вертикально вниз, к центру Земли.",
                        formula: "F = m · g",
                        vars: "F — сила тяжести, m — масса, g — ускорение свободного падения (≈ 9.8 Н/кг)"
                    },
                    {
                        name: "Давление твердых тел",
                        desc: "Показывает, какая сила действует на единицу площади поверхности. Чем меньше площадь (например, острие иглы), тем больше давление.",
                        formula: "p = F / S",
                        vars: "p — давление (Па), F — сила (Н), S — площадь поверхности (м²)"
                    },
                    {
                        name: "Архимедова сила",
                        desc: "Выталкивающая сила, действующая на любое тело, погруженное в жидкость или газ. Именно благодаря ей плавают корабли.",
                        formula: "F_А = ρ_ж · g · V_п",
                        vars: "F_А — сила Архимеда, ρ_ж — плотность жидкости, V_п — объем погруженной части"
                    },
                    {
                        name: "Механическая работа",
                        desc: "Совершается, когда на тело действует сила, и тело под действием этой силы перемещается.",
                        formula: "A = F · s",
                        vars: "A — работа (Дж), F — сила, s — пройденный путь"
                    },
                    {
                        name: "Мощность",
                        desc: "Показывает быстроту совершения работы. Чем быстрее выполнена работа, тем больше развиваемая мощность.",
                        formula: "N = A / t",
                        vars: "N — мощность (Вт), A — работа, t — время"
                    }
                ]
            },
            8: {
                title: "8 класс: Тепловые, электрические и световые явления",
                topics: [
                    {
                        name: "Количество теплоты (нагревание)",
                        desc: "Энергия, которую тело получает при нагревании или отдает при охлаждении. Зависит от массы, вещества и изменения температуры.",
                        formula: "Q = c · m · (t_2 - t_1)",
                        vars: "Q — количество теплоты, c — удельная теплоемкость, m — масса, t — температура"
                    },
                    {
                        name: "Удельная теплота плавления",
                        desc: "Количество теплоты, необходимое для превращения 1 кг кристаллического вещества при температуре плавления в жидкость.",
                        formula: "Q = λ · m",
                        vars: "Q — количество теплоты, λ (лямбда) — удельная теплота плавления, m — масса"
                    },
                    {
                        name: "Закон Ома для участка цепи",
                        desc: "Главный закон электричества: чем больше напряжение, тем больше ток; но чем больше сопротивление, тем ток меньше.",
                        formula: "I = U / R",
                        vars: "I — сила тока, U — напряжение, R — сопротивление"
                    },
                    {
                        name: "Работа электрического тока",
                        desc: "Показывает, сколько электрической энергии превращается в другие виды энергии (тепло, свет, механическую работу).",
                        formula: "A = U · I · t",
                        vars: "A — работа тока, U — напряжение, I — сила тока, t — время"
                    },
                    {
                        name: "Закон преломления света",
                        desc: "При переходе луча света из одной среды в другую (например, из воздуха в воду) он меняет свое направление.",
                        formula: "sin(α) / sin(γ) = n_2 / n_1",
                        vars: "α — угол падения, γ — угол преломления, n — показатель преломления среды"
                    }
                ]
            },
            9: {
                title: "9 класс: Кинематика, динамика, законы сохранения",
                topics: [
                    {
                        name: "Проекция перемещения",
                        desc: "Показывает изменение координаты тела вдоль выбранной оси (с учетом направления). Если движение равноускоренное, вычисляется через скорость и ускорение.",
                        formula: "s_x = v_0x · t + (a_x · t²) / 2",
                        vars: "s_x — проекция перемещения, v_0x — проекция нач. скорости, a_x — проекция ускорения, t — время"
                    },
                    {
                        name: "Ускорение",
                        desc: "Показывает, как быстро меняется скорость тела со временем. Если тело разгоняется, ускорение положительное, если тормозит — отрицательное.",
                        formula: "a = (v - v_0) / t",
                        vars: "a — ускорение, v — конечная скорость, v_0 — начальная скорость, t — время"
                    },
                    {
                        name: "Центростремительное ускорение",
                        desc: "Ускорение тела, движущегося по окружности с постоянной по модулю скоростью. Оно всегда направлено к центру этой окружности.",
                        formula: "a_ц = v² / R",
                        vars: "a_ц — центростремительное ускорение, v — скорость, R — радиус окружности"
                    },
                    {
                        name: "Второй закон Ньютона",
                        desc: "Основной закон динамики. Ускорение, которое получает тело, прямо пропорционально силе, действующей на него, и обратно пропорционально массе.",
                        formula: "F = m · a",
                        vars: "F — равнодействующая сила, m — масса, a — ускорение"
                    },
                    {
                        name: "Импульс тела",
                        desc: "Векторная величина, являющаяся мерой механического движения. Направление импульса всегда совпадает с направлением скорости.",
                        formula: "p = m · v",
                        vars: "p — импульс (кг·м/с), m — масса, v — скорость"
                    },
                    {
                        name: "Закон сохранения импульса",
                        desc: "Суммарный импульс замкнутой системы тел остается постоянным при любых взаимодействиях тел этой системы между собой.",
                        formula: "m_1·v_1 + m_2·v_2 = m_1·v_1' + m_2·v_2'",
                        vars: "m — массы тел, v — скорости до взаимодействия, v' — скорости после взаимодействия"
                    },
                    {
                        name: "Закон всемирного тяготения",
                        desc: "Любые два тела во Вселенной притягиваются друг к другу. Сила зависит от их масс и расстояния между ними.",
                        formula: "F = G · (m_1 · m_2) / R²",
                        vars: "G — гравитационная постоянная, R — расстояние между центрами масс"
                    }
                ]
            },
            10: {
                title: "10 класс: Молекулярная физика, термодинамика и электростатика",
                topics: [
                    {
                        name: "Уравнение Менделеева-Клапейрона",
                        desc: "Связывает давление, объем, температуру и массу идеального газа. Позволяет описать состояние газа в любой момент.",
                        formula: "p · V = (m / M) · R · T",
                        vars: "p - давление, V - объем, M - молярная масса, R - унив. газовая постоянная, T - температура (в Кельвинах)"
                    },
                    {
                        name: "Первое начало термодинамики",
                        desc: "Закон сохранения энергии для тепловых процессов: теплота, переданная системе, идет на изменение ее внутренней энергии и на совершение работы.",
                        formula: "Q = ΔU + A",
                        vars: "Q — подведенное тепло, ΔU — изменение внутренней энергии, A — работа газа"
                    },
                    {
                        name: "Закон Кулона",
                        desc: "Описывает силу взаимодействия (притяжения или отталкивания) между двумя неподвижными точечными зарядами.",
                        formula: "F = k · (|q_1| · |q_2|) / r²",
                        vars: "q_1, q_2 — заряды, r — расстояние между ними, k — электрическая постоянная"
                    },
                    {
                        name: "Напряженность электрического поля",
                        desc: "Силовая характеристика электрического поля. Показывает, какая сила действует на единичный положительный заряд.",
                        formula: "E = F / q",
                        vars: "E — напряженность поля (В/м), F — сила, действующая на заряд, q — величина заряда"
                    },
                    {
                        name: "Электроемкость плоского конденсатора",
                        desc: "Характеризует способность конденсатора накапливать электрический заряд. Зависит от площади пластин и расстояния между ними.",
                        formula: "C = (ε · ε_0 · S) / d",
                        vars: "C — емкость (Ф), S — площадь пластин, d — расстояние между ними, ε — диэлектрическая проницаемость"
                    }
                ]
            },
            11: {
                title: "11 класс: Электромагнетизм, оптика и квантовая физика",
                topics: [
                    {
                        name: "Магнитный поток",
                        desc: "Число линий магнитной индукции, пронизывающих заданную площадь. Зависит от силы магнита, площади рамки и угла ее наклона.",
                        formula: "Φ = B · S · cos(α)",
                        vars: "Φ (Фи) — магнитный поток (Вб), B — индукция, S — площадь, α — угол между нормалью и вектором B"
                    },
                    {
                        name: "Закон электромагнитной индукции",
                        desc: "При изменении магнитного потока, пронизывающего контур, в нем возникает ЭДС индукции. Именно так работают генераторы на электростанциях.",
                        formula: "ε_i = - ΔΦ / Δt",
                        vars: "ε_i — ЭДС индукции (В), ΔΦ — изменение потока, Δt — время"
                    },
                    {
                        name: "Энергия фотона (кванта света)",
                        desc: "Свет состоит из частиц — фотонов. Энергия каждого фотона напрямую зависит от частоты света (цвета).",
                        formula: "E = h · ν",
                        vars: "E — энергия, h — постоянная Планка, ν (ню) — частота излучения"
                    },
                    {
                        name: "Уравнение Эйнштейна для фотоэффекта",
                        desc: "Энергия поглощенного фотона идет на вырывание электрона из металла (работа выхода) и сообщение ему кинетической энергии.",
                        formula: "h · ν = A_вых + E_к",
                        vars: "hν — энергия фотона, A_вых — работа выхода, E_к — максимальная кинетическая энергия электрона"
                    },
                    {
                        name: "Закон радиоактивного распада",
                        desc: "Показывает, сколько радиоактивных ядер останется не распавшимися через определенное время.",
                        formula: "N = N_0 · 2^(-t / T)",
                        vars: "N — оставшиеся ядра, N_0 — начальное число, t — время, T — период полураспада"
                    },
                    {
                        name: "Связь массы и энергии",
                        desc: "Знаменитая формула Эйнштейна. Масса и энергия эквивалентны. Любое тело, обладающее массой, таит в себе колоссальную энергию.",
                        formula: "E = m · c²",
                        vars: "E — энергия покоя, m — масса, c — скорость света в вакууме"
                    }
                ]
            }
        };

        // Функция отрисовки контента
        function loadClass(grade) {
            // 1. Сбрасываем стили у всех кнопок
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-brand-blue', 'text-white', 'border-brand-blue', 'shadow-[0_0_15px_rgba(14,165,233,0.5)]');
                btn.classList.add('bg-white/5', 'text-slate-300', 'border-white/10');
            });
            
            // 2. Выделяем нажатую кнопку (по надежному ID)
            const clickedBtn = document.getElementById('btn-' + grade);
            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white/5', 'text-slate-300', 'border-white/10');
                clickedBtn.classList.add('bg-brand-blue', 'text-white', 'border-brand-blue', 'shadow-[0_0_15px_rgba(14,165,233,0.5)]');
            }

            // 3. Получаем данные для класса
            const data = physicsData[grade];
            const contentArea = document.getElementById('content-area');
            
            // 4. Формируем HTML карточек
            let html = `
                <div class="fade-in mb-8">
                    <h2 class="text-3xl font-bold text-white border-b border-white/10 pb-4 inline-block pr-10">${data.title}</h2>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            `;

            data.topics.forEach((topic, index) => {
                const delay = index * 0.1; 
                html += `
                    <div class="glass-card rounded-2xl p-6 fade-in" style="animation-delay: ${delay}s">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue font-bold shadow-inner">
                                ${index + 1}
                            </div>
                            <h3 class="text-xl font-bold text-white">${topic.name}</h3>
                        </div>
                        
                        <p class="text-slate-400 mb-5 text-sm leading-relaxed">
                            ${topic.desc}
                        </p>
                        
                        <div class="formula-box p-4 rounded-lg">
                            <span class="text-xs text-brand-blue uppercase font-bold tracking-wider mb-1 block">Формула</span>
                            <code class="font-mono text-xl text-emerald-400 block mb-3">${topic.formula}</code>
                            <p class="font-mono text-xs text-slate-500 border-t border-white/5 pt-2">
                                ${topic.vars}
                            </p>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            
            // 5. Вставляем HTML на страницу
            contentArea.innerHTML = html;
        }
    </script>
</body>
</html>
