        tailwind.config = {

                        sans: ['Inter', 'sans-serif'],

                    },
                    colors: {

    <style>
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; overflow-x: hidden; }
        
        #particles-js {
            position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -2;
            background: radial-gradient(ellipse at top right, #1e293b, #0f172a, #000000);
        }

        #mouse-glow {
            position: fixed; top: 0; left: 0; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(14,165,233,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; pointer-events: none; z-index: -1;
            transform: translate(-50%, -50%); transition: opacity 0.3s ease; opacity: 0;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .glass-card-inner { transform: translateZ(30px); }
        .formula-box {
            background: rgba(0, 0, 0, 0.4); border-left: 4px solid #0ea5e9;
            transform: translateZ(40px); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .example-box {
            background: rgba(15, 23, 42, 0.7); border-top: 2px solid #10b981; transform: translateZ(20px);
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        #model-3d-container {
            width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; pointer-events: none; position: relative;
        }
        #model-3d-container::before {
            content: ''; position: absolute; width: 150px; height: 150px;
            background: rgba(14, 165, 233, 0.2); filter: blur(40px); border-radius: 50%; z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden selection:bg-brand-blue selection:text-white relative">

    <div id="particles-js"></div>
    <div id="mouse-glow"></div>

    <nav class="w-full p-6 flex justify-between items-center relative z-50">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-brand-blue drop-shadow-[0_0_10px_rgba(14,165,233,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
            <span class="text-2xl font-bold tracking-tight text-white drop-shadow-md">Phys<span class="text-brand-blue">Hub</span></span>
        </div>

    <main class="container mx-auto px-6 pt-6 pb-20 relative z-10">
        <div class="text-center max-w-3xl mx-auto mb-8 relative">
            <p class="font-mono text-sm italic text-slate-400 opacity-80 absolute -top-6 left-1/2 transform -translate-x-1/2">by sahar²¹</p>
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight text-white drop-shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
                Школьный курс <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_15px_rgba(14,165,233,0.5)]">Физики</span>
            </h1>
        </div>

        <div class="max-w-md mx-auto mb-8 relative z-20 transition-transform duration-300 hover:scale-[1.02]">
            <input type="text" id="search-input" placeholder="Поиск по темам и формулам..." class="w-full bg-black/40 border border-white/20 rounded-full py-3 px-6 text-white placeholder-slate-400 focus:outline-none focus:border-brand-blue focus:ring-1 focus:ring-brand-blue backdrop-blur-lg shadow-[0_5px_15px_-5px_rgba(0,0,0,0.5)] transition-all text-sm font-medium">
            <svg class="w-5 h-5 absolute right-5 top-3 text-brand-blue opacity-70 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mb-4 relative z-20">
            <button id="btn-7" onclick="loadClass(7)" class="class-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">7 класс</button>
            <button id="btn-8" onclick="loadClass(8)" class="class-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">8 класс</button>
            <button id="btn-9" onclick="loadClass(9)" class="class-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">9 класс</button>
            <button id="btn-10" onclick="loadClass(10)" class="class-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">10 класс</button>
            <button id="btn-11" onclick="loadClass(11)" class="class-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-white/5 border border-white/10 hover:bg-brand-blue hover:text-white text-slate-300 shadow-lg">11 класс</button>
        </div>

        <div id="model-3d-container" class="drop-shadow-[0_0_25px_rgba(14,165,233,0.6)]"></div>

        <div id="content-area" class="max-w-5xl mx-auto relative z-10 pb-10"></div>
    </main>

    <script>
        const glow = document.getElementById('mouse-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1'; glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px';
        });
        document.addEventListener('mouseleave', () => glow.style.opacity = '0');
        document.addEventListener('touchmove', (e) => {
            glow.style.opacity = '1'; glow.style.left = e.touches[0].clientX + 'px'; glow.style.top = e.touches[0].clientY + 'px';
        });

        const physicsFacts = [
            "Самая низкая возможная температура во Вселенной — абсолютный нуль (−273.15 °C).",
            "Свет от Солнца до Земли летит примерно 8 минут и 20 секунд.",
            "Если удалить пустое пространство внутри атомов из каждого человека на Земле, всё человечество поместится в кубике сахара.",
            "Вода может кипеть и замерзать одновременно. Это состояние называется «тройной точкой».",
            "Молния нагревает воздух вокруг себя до 30 000 °C — это в 5 раз горячее поверхности Солнца!"
        ];

        // --- БАЗА ДАННЫХ С ОБНОВЛЕННЫМ 9 КЛАССОМ ---
        const physicsData = {
            7: {
                title: "7 класс: Механика и давление",
                topics: [
                    { name: "Скорость при равномерном движении", desc: "Быстрота перемещения тела за единицу времени.", formula: "v = s / t", vars: "v — скорость (м/с), s — путь (м), t — время (с)", example: { dano: "s = 100 м, t = 20 с", sol: "v = 100 / 20 = 5", ans: "5 м/с" } },
                    { name: "Плотность вещества", desc: "Масса, приходящаяся на единицу объема.", formula: "ρ = m / V", vars: "ρ — плотность (кг/м³), m — масса, V — объем", example: { dano: "m = 400 кг, V = 0.5 м³", sol: "ρ = 400 / 0.5 = 800", ans: "800 кг/м³" } },
                    { name: "Сила тяжести", desc: "Сила, с которой Земля притягивает к себе тело.", formula: "F_тяж = m · g", vars: "g ≈ 9.8 Н/кг — ускорение свободного падения", example: { dano: "m = 5 кг, g ≈ 10", sol: "F = 5 · 10 = 50", ans: "50 Н" } },
                    { name: "Сила упругости (Закон Гука)", desc: "Возникает при деформации и стремится вернуть тело в исходное состояние.", formula: "F_упр = k · Δl", vars: "k — жесткость пружины, Δl — удлинение", example: { dano: "k = 100 Н/м, Δl = 0.2 м", sol: "F = 100 · 0.2 = 20", ans: "20 Н" } },
                    { name: "Вес тела", desc: "Сила, с которой тело давит на опору или подвес.", formula: "P = m · g", vars: "P — вес тела (Н)", example: { dano: "m = 60 кг", sol: "P = 60 · 10 = 600", ans: "600 Н" } },
                    { name: "Сила трения скольжения", desc: "Возникает при движении одного тела по поверхности другого.", formula: "F_тр = μ · N", vars: "μ — коэффициент трения, N — сила реакции опоры", example: { dano: "μ = 0.2, N = 100 Н", sol: "F = 0.2 · 100 = 20", ans: "20 Н" } },
                    { name: "Давление твердых тел", desc: "Величина, равная отношению силы к площади.", formula: "p = F / S", vars: "p — давление (Па), F — сила давления, S — площадь", example: { dano: "F = 100 Н, S = 2 м²", sol: "p = 100 / 2 = 50", ans: "50 Па" } },
                    { name: "Архимедова сила", desc: "Выталкивающая сила, действующая на погруженное тело.", formula: "F_А = ρ_ж · g · V_п", vars: "ρ_ж — плотность жидкости, V_п — объем погруженной части", example: { dano: "ρ_ж = 1000, V_п = 0.1 м³", sol: "F_А = 1000 · 10 · 0.1 = 1000", ans: "1000 Н" } },
                    { name: "Механическая работа", desc: "Совершается, когда на тело действует сила, и оно перемещается.", formula: "A = F · s", vars: "A — работа (Дж), F — сила, s — путь", example: { dano: "F = 50 Н, s = 4 м", sol: "A = 50 · 4 = 200", ans: "200 Дж" } },
                    { name: "Мощность", desc: "Показывает быстроту совершения механической работы.", formula: "N = A / t", vars: "N — мощность (Вт), A — работа, t — время", example: { dano: "A = 600 Дж, t = 10 с", sol: "N = 600 / 10 = 60", ans: "60 Вт" } }
                ]
            },
            8: {
                title: "8 класс: Теплота и Электричество",
                topics: [
                    { name: "Количество теплоты", desc: "Энергия, которую тело получает или отдает.", formula: "Q = c · m · (t_2 - t_1)", vars: "c — удельная теплоемкость (Дж/кг·°C)", example: { dano: "c = 4200, m = 2 кг, Δt = 50°C", sol: "Q = 4200 · 2 · 50 = 420000", ans: "420 кДж" } },
                    { name: "Плавление и кристаллизация", desc: "Теплота при плавлении твердого тела.", formula: "Q = λ · m", vars: "λ (лямбда) — удельная теплота плавления", example: { dano: "λ = 3.4·10⁵ Дж/кг, m = 3 кг", sol: "Q = 3.4·10⁵ · 3 = 10.2·10⁵", ans: "1020 кДж" } },
                    { name: "Сила электрического тока", desc: "Заряд, проходящий через сечение за время.", formula: "I = q / t", vars: "I — ток (А), q — заряд (Кл), t — время", example: { dano: "q = 10 Кл, t = 2 с", sol: "I = 10 / 2 = 5", ans: "5 А" } },
                    { name: "Закон Ома для участка цепи", desc: "Основа электротехники.", formula: "I = U / R", vars: "I — сила тока, U — напряжение, R — сопротивление", example: { dano: "U = 220 В, R = 55 Ом", sol: "I = 220 / 55 = 4", ans: "4 А" } },
                    { name: "Закон Джоуля-Ленца", desc: "Количество теплоты, выделяемое проводником.", formula: "Q = I² · R · t", vars: "Q — теплота, I — ток, R — сопротивление", example: { dano: "I = 2 А, R = 10 Ом, t = 5 с", sol: "Q = 2² · 10 · 5 = 200", ans: "200 Дж" } }
                ]
            },
            9: {
                title: "9 класс: Кинематика, Динамика, Волны и Атом",
                topics: [
                    { name: "Координаты при движении", desc: "Уравнение координаты тела при прямолинейном равномерном движении.", formula: "x = x_0 + v_x · t", vars: "x — конечная координата, x_0 — начальная координата, v_x — проекция скорости", example: { dano: "x_0 = 5 м, v_x = 2 м/с, t = 3 с", sol: "x = 5 + 2 · 3 = 11", ans: "11 м" } },
                    { name: "Ускорение", desc: "Быстрота изменения скорости при прямолинейном движении.", formula: "a = (v - v_0) / t", vars: "a — ускорение, v — конечная скорость, v_0 — начальная скорость", example: { dano: "v_0 = 0 м/с, v = 20 м/с, t = 5 с", sol: "a = (20 - 0) / 5", ans: "4 м/с²" } },
                    { name: "Перемещение при равноускоренном движении", desc: "Путь при движении с ускорением (проекция).", formula: "s_x = v_0x · t + (a_x · t²) / 2", vars: "v_0x — нач. скорость, a_x — ускорение", example: { dano: "v_0 = 2 м/с, a = 1 м/с², t = 4 с", sol: "s = 2·4 + (1·16)/2 = 8+8=16", ans: "16 м" } },
                    { name: "Первый закон Ньютона", desc: "Тело сохраняет состояние покоя или равномерного движения, если равнодействующая сил равна нулю.", formula: "ΣF = 0  =>  v = const", vars: "ΣF — сумма всех сил", example: { dano: "Тело движется с v=const", sol: "По первому закону равнодействующая сил равна 0.", ans: "0 Н" } },
                    { name: "Второй закон Ньютона", desc: "Ускорение тела прямо пропорционально силе и обратно пропорционально массе.", formula: "F = m · a", vars: "F — равнодействующая всех сил, m — масса, a — ускорение", example: { dano: "m = 5 кг, a = 2 м/с²", sol: "F = 5 · 2 = 10", ans: "10 Н" } },
                    { name: "Третий закон Ньютона", desc: "Силы, с которыми тела действуют друг на друга, равны по модулю и противоположны по направлению.", formula: "F₁ = -F₂", vars: "F₁, F₂ — силы взаимодействия", example: { dano: "Человек давит на пол силой 500 Н", sol: "По 3-му закону пол давит на человека с силой 500 Н.", ans: "500 Н" } },
                    { name: "Свободное падение тел", desc: "Равноускоренное движение под действием только силы тяжести.", formula: "h = (g · t²) / 2", vars: "h — высота, g ≈ 9.8 м/с² — ускорение свободного падения", example: { dano: "t = 3 с, v_0 = 0, g ≈ 10 м/с²", sol: "h = (10 · 9) / 2 = 45", ans: "45 м" } },
                    { name: "Закон всемирного тяготения", desc: "Сила взаимного притяжения любых двух масс.", formula: "F = G · (m₁ · m₂) / R²", vars: "G — гравитационная постоянная, R — расстояние между центрами", example: { dano: "m₁, m₂ = 10⁵ кг, R = 10 м", sol: "F = 6.67·10⁻¹¹ · 10¹⁰ / 100 = 6.67·10⁻³", ans: "6.67 мН" } },
                    { name: "Вес тела с ускорением", desc: "Вес тела, движущегося с ускорением по вертикали (перегрузка/невесомость).", formula: "P = m · (g ± a)", vars: "a — ускорение опоры (+ при движении вверх, - при движении вниз)", example: { dano: "m = 50 кг, лифт едет вверх с a = 2 м/с², g = 10", sol: "P = 50 · (10 + 2) = 50 · 12 = 600", ans: "600 Н" } },
                    { name: "Период и частота колебаний", desc: "Механические колебания. Связь времени одного полного колебания и частоты.", formula: "T = 1 / ν", vars: "T — период (с), ν (ню) — частота (Гц)", example: { dano: "Частота ν = 50 Гц", sol: "T = 1 / 50 = 0.02", ans: "0.02 с" } },
                    { name: "Длина волны и скорость звука", desc: "Расстояние между ближайшими точками волны, колеблющимися в одинаковой фазе.", formula: "λ = v · T = v / ν", vars: "λ — длина волны (м), v — скорость волны", example: { dano: "Скорость звука v = 340 м/с, частота ν = 170 Гц", sol: "λ = 340 / 170 = 2", ans: "2 м" } },
                    { name: "Закон отражения света", desc: "Световые явления. Угол падения луча равен углу его отражения.", formula: "∠α = ∠β", vars: "Оба луча и перпендикуляр лежат в одной плоскости", example: { dano: "Угол между падающим лучом и поверхностью = 30°", sol: "Угол падения = 90 - 30 = 60°. Отражение равно падению.", ans: "60°" } },
                    { name: "Энергия связи атомного ядра", desc: "Строение ядра. Энергия, необходимая для полного расщепления ядра на нуклоны.", formula: "E_св = Δm · c²", vars: "Δm — дефект масс, c — скорость света", example: { dano: "Дефект масс Δm = 1 а.е.м.", sol: "Перевод через коэффициент: 1 а.е.м. эквивалентна 931.5 МэВ", ans: "931.5 МэВ" } },
                    { name: "Закон радиоактивного распада", desc: "Использование ядерной энергии. Закономерность убывания активности изотопа.", formula: "N = N_0 · 2^(-t / T)", vars: "N — оставшиеся ядра, N_0 — начальные, T — период полураспада", example: { dano: "T = 8 дней, t = 16 дней, N_0 = 100%", sol: "N = 100 · 2^(-16/8) = 100 / 4", ans: "25%" } }
                ]
            },
            10: {
                title: "10 класс: Термодинамика и Электростатика",
                topics: [
                    { name: "Уравнение Менделеева-Клапейрона", desc: "Уравнение состояния идеального газа.", formula: "p · V = (m / M) · R · T", vars: "R = 8.31 Дж/(моль·К) — газовая постоянная", example: { dano: "p=10⁵, V=0.083, T=300", sol: "ν (ню) = pV/RT ≈ 3.3", ans: "3.3 моль" } },
                    { name: "Внутренняя энергия газа", desc: "Зависит только от температуры.", formula: "U = (3/2) · (m / M) · R · T", vars: "U — энергия (Дж)", example: { dano: "ν = 1 моль, T = 300 К", sol: "U = 1.5 · 1 · 8.31 · 300 ≈ 3740", ans: "3.74 кДж" } },
                    { name: "Первое начало термодинамики", desc: "Закон сохранения энергии в термодинамике.", formula: "Q = ΔU + A", vars: "Q — подведенное тепло, A — работа газа", example: { dano: "A = 200 Дж, ΔU = 300 Дж", sol: "Q = 300 + 200 = 500", ans: "500 Дж" } },
                    { name: "Закон Кулона", desc: "Сила взаимодействия точечных зарядов.", formula: "F = k · (|q₁| · |q₂|) / r²", vars: "k = 9·10⁹ Н·м²/Кл²", example: { dano: "q₁,q₂=3 мкКл, r=0.1 м", sol: "F = 9·10⁹ · (9·10⁻¹²) / 0.01 = 8.1", ans: "8.1 Н" } },
                    { name: "Напряженность электрического поля", desc: "Силовая характеристика.", formula: "E = F / q", vars: "E — напряженность (В/м)", example: { dano: "F = 0.05 Н, q = 10 мкКл", sol: "E = 0.05 / 10⁻⁵ = 5000", ans: "5000 В/м" } }
                ]
            },
            11: {
                title: "11 класс: Электромагнетизм и Кванты",
                topics: [
                    { name: "Сила Ампера", desc: "Действует на проводник с током в магнитном поле.", formula: "F_А = I · B · l · sin(α)", vars: "I — ток, B — индукция, l — длина", example: { dano: "I=2А, B=0.1Тл, l=1м, α=90°", sol: "F = 2 · 0.1 · 1 · 1 = 0.2", ans: "0.2 Н" } },
                    { name: "Сила Лоренца", desc: "Действует на движущийся заряд.", formula: "F_Л = q · v · B · sin(α)", vars: "q — заряд, v — скорость", example: { dano: "q=1Кл, v=10м/с, B=2Тл, α=90°", sol: "F = 1 · 10 · 2 · 1 = 20", ans: "20 Н" } },
                    { name: "Закон электромагнитной индукции", desc: "ЭДС Фарадея.", formula: "ε_i = - ΔΦ / Δt", vars: "Возникновение тока при изменении потока.", example: { dano: "ΔΦ = 0.4 Вб, Δt = 2 с", sol: "|ε_i| = 0.4 / 2 = 0.2", ans: "0.2 В" } },
                    { name: "Энергия фотона", desc: "Квант электромагнитного излучения.", formula: "E = h · ν", vars: "h — постоянная Планка", example: { dano: "ν = 5·10¹⁴ Гц", sol: "E = 6.63·10⁻³⁴ · 5·10¹⁴", ans: "3.3·10⁻¹⁹ Дж" } },
                    { name: "Уравнение Эйнштейна для фотоэффекта", desc: "Энергия фотона идет на работу выхода и кинетическую энергию.", formula: "h · ν = A_вых + E_к", vars: "A_вых — работа выхода электрона", example: { dano: "A_вых = 2 эВ, E_к = 1 эВ", sol: "E_ф = 2 + 1 = 3", ans: "3 эВ" } }
                ]
            }
        };

        // --- ЛОГИКА 3D ФОНА ---
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 45 }, "color": { "value": "#0ea5e9" }, "shape": { "type": "circle" },
                "opacity": { "value": 0.4 }, "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#0ea5e9", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.2, "direction": "none" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } } }
        });

        // --- ЛОГИКА 3D ГОЛОГРАММ (Three.js) ---
        let scene, camera, renderer, currentMesh;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;

        function init3D() {
            const container = document.getElementById('model-3d-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            camera.position.z = 6;
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(220, 220);
            container.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0x0ea5e9, 2, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2);
                mouseY = (e.clientY - window.innerHeight / 2);
                targetRotationY = mouseX * 0.002;
                targetRotationX = mouseY * 0.002;
            });

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (currentMesh) {
                currentMesh.rotation.y += 0.01 + (targetRotationY - currentMesh.rotation.y) * 0.05;
                currentMesh.rotation.x += 0.005 + (targetRotationX - currentMesh.rotation.x) * 0.05;
            }
            renderer.render(scene, camera);
        }

        function spawn3DModel(grade) {
            if (!scene) init3D();
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            let geometry;
            if (grade === 'main') geometry = new THREE.IcosahedronGeometry(2, 0); 
            else if (grade === 'search') geometry = new THREE.OctahedronGeometry(2, 0);
            else if (grade === 7) geometry = new THREE.BoxGeometry(2.2, 2.2, 2.2); 
            else if (grade === 8) geometry = new THREE.TorusGeometry(1.4, 0.5, 16, 50); 
            else if (grade === 9) geometry = new THREE.ConeGeometry(1.8, 2.8, 16); 
            else if (grade === 10) geometry = new THREE.SphereGeometry(1.8, 16, 16); 
            else if (grade === 11) geometry = new THREE.TorusKnotGeometry(1.1, 0.35, 64, 16); 

            const material = new THREE.MeshStandardMaterial({
                color: 0x0ea5e9, wireframe: true, emissive: 0x0ea5e9, emissiveIntensity: 0.8
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        // --- ЛОГИКА ГЛАВНОГО ЭКРАНА ---
        function renderWelcomeScreen() {
            spawn3DModel('main');
            const randomFact = physicsFacts[Math.floor(Math.random() * physicsFacts.length)];
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="glass-card vanilla-tilt-card rounded-2xl p-8 fade-in">
                    <div class="glass-card-inner">
                        <h2 class="text-3xl font-bold text-white mb-4 drop-shadow-md">Добро пожаловать в справочник!</h2>
                        <p class="text-lg text-slate-300 mb-6 leading-relaxed">
                            Интерактивный путеводитель по ключевым терминам, законам и формулам. От классической механики до квантовой физики.
                        </p>
                        
                        <div class="bg-gradient-to-r from-brand-blue/20 to-transparent p-4 rounded-xl border-l-4 border-brand-blue mb-8 shadow-inner" style="transform: translateZ(25px);">
                            <h4 class="text-brand-blue font-bold text-sm uppercase tracking-wider mb-1">💡 А знаете ли вы?</h4>
                            <p class="text-slate-200 text-sm italic">«${randomFact}»</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-black/30 p-5 rounded-xl border border-white/5 border-l-2 border-l-brand-blue shadow-inner" style="transform: translateZ(20px);">
                                <h3 class="text-white font-bold mb-2">📚 55+ Тем</h3>
                                <p class="text-xs text-slate-400">Полный школьный курс от кинематики до ядерной физики.</p>
                            </div>
                            <div class="bg-black/30 p-5 rounded-xl border border-white/5 border-l-2 border-l-emerald-500 shadow-inner" style="transform: translateZ(20px);">
                                <h3 class="text-white font-bold mb-2">💡 Решебник</h3>
                                <p class="text-xs text-slate-400">К каждой теме написан пример решения с оформлением.</p>
                            </div>
                            <div class="bg-black/30 p-5 rounded-xl border border-white/5 border-l-2 border-l-purple-500 shadow-inner" style="transform: translateZ(20px);">
                                <h3 class="text-white font-bold mb-2">🧊 3D Модели</h3>
                                <p class="text-xs text-slate-400">Голограммы реагируют на вашу мышку или касание.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                VanillaTilt.init(document.querySelectorAll(".vanilla-tilt-card"), { max: 5, speed: 400, glare: true, "max-glare": 0.1, scale: 1.01 });
            }, 100);
        }

        window.addEventListener('DOMContentLoaded', renderWelcomeScreen);

        // --- ЛОГИКА ОТРИСОВКИ ТЕМ ---
        function loadClass(grade) {
            document.getElementById('search-input').value = ''; 
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-brand-blue', 'text-white', 'shadow-[0_0_20px_rgba(14,165,233,0.8)]');
                btn.classList.add('bg-white/5', 'text-slate-300');
            });
            const clickedBtn = document.getElementById('btn-' + grade);
            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white/5', 'text-slate-300');
                clickedBtn.classList.add('bg-brand-blue', 'text-white', 'shadow-[0_0_20px_rgba(14,165,233,0.8)]');
            }

            spawn3DModel(grade);

            const data = physicsData[grade];
            let html = `<div class="fade-in mb-6 text-center md:text-left"><h2 class="text-2xl font-bold text-white border-b border-white/10 pb-3 inline-block drop-shadow-md">${data.title}</h2></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6">`;
            html += generateCardsHtml(data.topics);
            html += `</div>`;
            
            document.getElementById('content-area').innerHTML = html;
            setTimeout(() => VanillaTilt.init(document.querySelectorAll(".vanilla-tilt-card"), { max: 6, speed: 400, glare: true, "max-glare": 0.15, scale: 1.02 }), 100);
        }

        // --- ЛОГИКА ПОИСКА ---
        document.getElementById('search-input').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-brand-blue', 'text-white', 'shadow-[0_0_20px_rgba(14,165,233,0.8)]');
                btn.classList.add('bg-white/5', 'text-slate-300');
            });

            if (query.length === 0) {
                renderWelcomeScreen();
                return;
            }

            spawn3DModel('search'); 

            let results = [];
            for (let grade in physicsData) {
                physicsData[grade].topics.forEach(topic => {
                    if (topic.name.toLowerCase().includes(query) || 
                        topic.desc.toLowerCase().includes(query) || 
                        topic.formula.toLowerCase().includes(query)) {
                        results.push({ ...topic, gradeBadge: grade + " класс" });
                    }
                });
            }

            const contentArea = document.getElementById('content-area');
            if (results.length === 0) {
                contentArea.innerHTML = `<div class="text-center text-slate-400 py-10 bg-black/20 rounded-xl backdrop-blur-md border border-white/5 fade-in">По запросу «<span class="text-white">${query}</span>» ничего не найдено.</div>`;
                return;
            }

            let html = `<div class="fade-in mb-6 text-center md:text-left"><h2 class="text-2xl font-bold text-white border-b border-white/10 pb-3 inline-block drop-shadow-md">Результаты поиска: ${results.length}</h2></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6">`;
            html += generateCardsHtml(results);
            html += `</div>`;
            
            contentArea.innerHTML = html;
            setTimeout(() => VanillaTilt.init(document.querySelectorAll(".vanilla-tilt-card"), { max: 6, speed: 400, glare: true, "max-glare": 0.15, scale: 1.02 }), 100);
        });

        function generateCardsHtml(topics) {
            let html = '';
            topics.forEach((topic, index) => {
                let exampleHtml = '';
                if (topic.example) {
                    exampleHtml = `
                        <div class="example-box mt-4 p-3 rounded-lg shadow-inner">
                            <h4 class="text-xs text-emerald-400 font-bold mb-2 uppercase flex items-center gap-1">Пример решения</h4>
                            <div class="flex flex-col gap-1 text-xs font-mono text-slate-300">
                                <p><span class="text-slate-500">Дано:</span> ${topic.example.dano}</p>
                                <p><span class="text-slate-500">Реш:</span> ${topic.example.sol}</p>
                                <p class="text-brand-blue font-bold bg-brand-blue/20 inline-block px-2 py-1 rounded w-max mt-1">Ответ: ${topic.example.ans}</p>
                            </div>
                        </div>`;
                }
                
                let badgeHtml = topic.gradeBadge ? `<span class="absolute top-4 right-4 bg-brand-blue/20 text-brand-blue text-[10px] font-bold px-2 py-1 rounded border border-brand-blue/30 drop-shadow-md" style="transform: translateZ(20px);">${topic.gradeBadge}</span>` : '';

                html += `
                    <div class="glass-card vanilla-tilt-card rounded-2xl p-5 fade-in flex flex-col justify-between" style="animation-delay: ${index * 0.05}s">
                        ${badgeHtml}
                        <div class="glass-card-inner">
                            <div class="flex items-center gap-3 mb-3 pr-16">
                                <div class="w-8 h-8 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue font-bold shadow-[0_0_15px_rgba(14,165,233,0.3)] shrink-0">${index + 1}</div>
                                <h3 class="text-lg font-bold text-white drop-shadow-md leading-tight">${topic.name}</h3>
                            </div>
                            <p class="text-slate-300 mb-4 text-sm drop-shadow-sm leading-relaxed">${topic.desc}</p>
                            <div class="formula-box p-3 rounded-lg">
                                <span class="text-[10px] text-brand-blue font-bold uppercase mb-1 block tracking-wider">Формула</span>
                                <code class="font-mono text-lg text-emerald-400 block mb-2 drop-shadow-[0_0_8px_rgba(16,185,129,0.4)]">${topic.formula}</code>
                                <p class="font-mono text-[11px] text-slate-400 border-t border-white/10 pt-2 leading-snug">${topic.vars}</p>
                            </div>
                        </div>
                        ${exampleHtml}
                    </div>`;
            });
            return html;
        }
    </script>
</body>
</html>
