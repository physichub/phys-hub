<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика | Школьный курс</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            blue: '#0ea5e9',
                            dark: '#0f172a',
                            card: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Эффект стекла и анимации */
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.4);
            box-shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.2);
        }
        .formula-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #0ea5e9;
        }
        .example-box {
            background: rgba(15, 23, 42, 0.6);
            border-top: 2px solid #10b981;
        }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-brand-dark to-black overflow-x-hidden selection:bg-brand-blue selection:text-white">

    <!-- Навигация -->
    <nav class="w-full p-6 flex justify-between items-center relative z-50">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
            <span class="text-2xl font-bold tracking-tight">Phys<span class="text-brand-blue">Hub</span></span>
        </div>
    </nav>

    <!-- Главный экран -->
    <main class="container mx-auto px-6 pt-10 pb-20">
        <div class="text-center max-w-3xl mx-auto mb-16 relative">
            <p class="font-mono text-sm italic text-slate-400 opacity-60 hover:opacity-100 hover:text-brand-blue transition-all duration-300 absolute -top-8 left-1/2 transform -translate-x-1/2 cursor-default">
                by sahar²¹
            </p>
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight leading-tight">
                Школьный курс <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Физики</span>
            </h1>
            <p class="text-lg text-slate-400">Выберите класс, чтобы открыть темы, понятные объяснения и формулы.</p>
        </div>

        <!-- Кнопки выбора класса -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="class-buttons">
            <button id="btn-7" onclick="loadClass(7)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">7 класс</button>
            <button id="btn-8" onclick="loadClass(8)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">8 класс</button>
            <button id="btn-9" onclick="loadClass(9)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">9 класс</button>
            <button id="btn-10" onclick="loadClass(10)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">10 класс</button>
            <button id="btn-11" onclick="loadClass(11)" class="class-btn px-6 py-3 rounded-full font-semibold text-sm transition-all duration-300 bg-white/5 border border-white/10 hover:bg-brand-blue/20 hover:border-brand-blue/50 text-slate-300">11 класс</button>
        </div>

        <!-- Контейнер для вывода тем -->
        <div id="content-area" class="max-w-5xl mx-auto">
            <div class="text-center text-slate-500 py-10">Нажмите на нужный класс выше, чтобы загрузить материалы.</div>
        </div>
    </main>

    <!-- Скрипт с данными и логикой -->
    <script>
        // База данных по всем классам
        const physicsData = {
            7: {
                title: "7 класс: Основы механики и силы",
                topics: [
                    {
                        name: "Инерция",
                        desc: "Явление сохранения скорости тела при отсутствии действия на него других тел. Если на тело не действуют силы, оно покоится или движется равномерно и прямолинейно.",
                        formula: "v = const (если F = 0)",
                        vars: "v — скорость, F — сила",
                        example: { dano: "Автомобиль едет по прямой.<br>Двигатель выключен.<br>Трение отсутствует.", sol: "Так как на автомобиль не действуют тормозящие силы (F=0), то по закону инерции он будет сохранять свою скорость неизменной.", ans: "v = const" }
                    },
                    {
                        name: "Сила",
                        desc: "Мера взаимодействия тел. Векторная величина. Сила является причиной изменения скорости тела или его деформации.",
                        formula: "R = F₁ + F₂",
                        vars: "R — равнодействующая сила, F₁, F₂ — действующие силы",
                        example: { dano: "F₁ = 30 Н (вправо)<br>F₂ = 50 Н (вправо)", sol: "Силы направлены в одну сторону, значит равнодействующая равна их сумме:<br>R = 30 + 50 = 80 Н.", ans: "80 Н (вправо)" }
                    },
                    {
                        name: "Сила тяжести",
                        desc: "Сила, с которой Земля притягивает к себе все тела. Направлена всегда вертикально вниз.",
                        formula: "F_тяж = m · g",
                        vars: "F_тяж — сила тяжести, m — масса, g — ускорение свободного падения (≈ 9.8 Н/кг)",
                        example: { dano: "m = 5 кг<br>g ≈ 10 Н/кг", sol: "F_тяж = m · g<br>F_тяж = 5 кг · 10 Н/кг = 50 Н", ans: "50 Н" }
                    },
                    {
                        name: "Сила упругости",
                        desc: "Сила, возникающая при деформации тела и стремящаяся вернуть его в исходное состояние (Закон Гука).",
                        formula: "F_упр = k · Δl",
                        vars: "F_упр — сила упругости, k — жесткость, Δl — удлинение (деформация)",
                        example: { dano: "k = 100 Н/м<br>Δl = 0.2 м", sol: "Применяем закон Гука:<br>F_упр = 100 · 0.2 = 20 Н", ans: "20 Н" }
                    },
                    {
                        name: "Вес тела",
                        desc: "Сила, с которой тело вследствие притяжения к Земле действует на опору или подвес. (В состоянии покоя равен силе тяжести).",
                        formula: "P = m · g",
                        vars: "P — вес тела (Н), m — масса, g — ускорение свободного падения",
                        example: { dano: "m = 60 кг<br>g ≈ 10 Н/кг<br>Тело покоится", sol: "Так как тело неподвижно, вес равен силе тяжести:<br>P = m · g = 60 · 10 = 600 Н", ans: "600 Н" }
                    },
                    {
                        name: "Сила трения",
                        desc: "Сила, возникающая при движении одного тела по поверхности другого и направленная в сторону, противоположную движению.",
                        formula: "F_тр = μ · N",
                        vars: "F_тр — сила трения, μ (мю) — коэффициент трения, N — сила нормального давления",
                        example: { dano: "μ = 0.2<br>N = 100 Н", sol: "F_тр = μ · N<br>F_тр = 0.2 · 100 = 20 Н", ans: "20 Н" }
                    },
                    {
                        name: "Механическая работа",
                        desc: "Совершается, когда на тело действует сила, и оно перемещается. Зависит от силы и пройденного пути.",
                        formula: "A = F · s",
                        vars: "A — работа (Дж), F — сила, s — пройденный путь",
                        example: { dano: "F = 50 Н<br>s = 4 м", sol: "A = F · s<br>A = 50 · 4 = 200 Дж", ans: "200 Дж" }
                    },
                    {
                        name: "Мощность",
                        desc: "Показывает быстроту совершения работы. Отношение работы ко времени, за которое она была совершена.",
                        formula: "N = A / t",
                        vars: "N — мощность (Вт), A — работа, t — время",
                        example: { dano: "A = 600 Дж<br>t = 10 с", sol: "N = A / t<br>N = 600 / 10 = 60 Вт", ans: "60 Вт" }
                    }
                ]
            },
            8: {
                title: "8 класс: Тепловые и электрические явления",
                topics: [
                    {
                        name: "Количество теплоты",
                        desc: "Энергия, которую тело получает при нагревании или отдает при охлаждении.",
                        formula: "Q = c · m · (t_2 - t_1)",
                        vars: "Q — теплота, c — удельная теплоемкость, m — масса, t — температура"
                    },
                    {
                        name: "Закон Ома",
                        desc: "Главный закон электричества: сила тока прямо пропорциональна напряжению и обратно пропорциональна сопротивлению.",
                        formula: "I = U / R",
                        vars: "I — сила тока, U — напряжение, R — сопротивление"
                    }
                ]
            },
            9: {
                title: "9 класс: Кинематика, динамика и законы Ньютона",
                topics: [
                    {
                        name: "Относительность движения",
                        desc: "Скорость тела зависит от выбора системы отсчета. Абсолютная скорость равна векторной сумме относительной и переносной скоростей.",
                        formula: "v_абс = v_отн + v_пер",
                        vars: "v_абс — скорость тела отн. неподвижной системы, v_отн — скорость тела отн. подвижной системы, v_пер — скорость самой подвижной системы",
                        example: { dano: "v_лодки (v_отн) = 5 м/с<br>v_течения (v_пер) = 2 м/с<br>Лодка плывет по течению", sol: "Так как направления совпадают, модули скоростей складываются:<br>v_абс = 5 + 2 = 7 м/с", ans: "7 м/с" }
                    },
                    {
                        name: "Скорость при криволинейном движении",
                        desc: "При равномерном движении по окружности скорость направлена по касательной к траектории.",
                        formula: "v = (2 · π · R) / T",
                        vars: "v — линейная скорость, R — радиус окружности, T — период обращения",
                        example: { dano: "R = 2 м<br>T = 3.14 с<br>π ≈ 3.14", sol: "v = (2 · 3.14 · 2) / 3.14<br>v = 12.56 / 3.14 = 4 м/с", ans: "4 м/с" }
                    },
                    {
                        name: "Первый закон Ньютона",
                        desc: "Существуют такие системы отсчета (инерциальные), относительно которых тело сохраняет свою скорость постоянной, если на него не действуют другие тела или их действие скомпенсировано.",
                        formula: "ΣF = 0  =>  v = const",
                        vars: "ΣF — векторная сумма всех сил, v — скорость",
                        example: { dano: "Санки катятся равномерно.<br>Сила тяги F = 15 Н.", sol: "Т.к. движение равномерное (v=const), сумма сил равна 0. Сила тяги компенсируется силой трения.<br>F_тр = F_тяги = 15 Н.", ans: "Сила трения 15 Н" }
                    },
                    {
                        name: "Третий закон Ньютона",
                        desc: "Тела действуют друг на друга с силами, равными по модулю и противоположными по направлению.",
                        formula: "F₁ = -F₂",
                        vars: "F₁ — сила действия первого тела, F₂ — сила действия второго тела",
                        example: { dano: "Земля притягивает яблоко с силой F₁ = 2 Н.", sol: "По 3-му закону Ньютона яблоко притягивает Землю с точно такой же по модулю силой.<br>F₂ = |-2 Н| = 2 Н", ans: "2 Н" }
                    },
                    {
                        name: "Свободное падение тел",
                        desc: "Движение тела под действием только силы тяжести. Является равноускоренным (если нет сопротивления воздуха).",
                        formula: "h = (g · t²) / 2",
                        vars: "h — высота (путь), g — ускорение свободного падения, t — время",
                        example: { dano: "t = 3 с<br>v_0 = 0 м/с<br>g ≈ 10 м/с²", sol: "h = (10 · 3²) / 2<br>h = (10 · 9) / 2 = 90 / 2 = 45 м", ans: "45 м" }
                    },
                    {
                        name: "Ускорение свободного падения",
                        desc: "Ускорение, придаваемое телу силой тяжести. Зависит от массы планеты и расстояния от ее центра.",
                        formula: "g = G · M / (R + h)²",
                        vars: "g — ускорение, G — гравитационная постоянная, M — масса планеты, R — радиус планеты, h — высота над поверхностью",
                        example: { dano: "Тело находится на поверхности Земли (h=0).", sol: "Подставляем в формулу h=0:<br>g = G · M / R².<br>Для Земли это значение равно ≈ 9.8 м/с².", ans: "≈ 9.8 м/с²" }
                    },
                    {
                        name: "Динамика криволинейного движения",
                        desc: "Чтобы тело двигалось по окружности, на него должна действовать сила, направленная к центру окружности (центростремительная сила).",
                        formula: "F = m · v² / R",
                        vars: "F — центростремительная сила, m — масса, v — скорость, R — радиус",
                        example: { dano: "m = 1000 кг (машина)<br>v = 10 м/с<br>R = 50 м", sol: "F = 1000 · (10²) / 50<br>F = 1000 · 100 / 50 = 2000 Н", ans: "2000 Н" }
                    }
                ]
            },
            10: {
                title: "10 класс: Молекулярная физика и термодинамика",
                topics: [
                    {
                        name: "Уравнение Менделеева-Клапейрона",
                        desc: "Связывает давление, объем, температуру и массу идеального газа.",
                        formula: "p · V = (m / M) · R · T",
                        vars: "p - давление, V - объем, M - молярная масса, R - газовая постоянная"
                    }
                ]
            },
            11: {
                title: "11 класс: Квантовая физика",
                topics: [
                    {
                        name: "Энергия фотона",
                        desc: "Свет состоит из частиц — фотонов. Энергия каждого фотона зависит от частоты.",
                        formula: "E = h · ν",
                        vars: "E — энергия, h — постоянная Планка, ν (ню) — частота"
                    }
                ]
            }
        };

        // Функция отрисовки контента
        function loadClass(grade) {
            // Сбрасываем стили
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-brand-blue', 'text-white', 'border-brand-blue', 'shadow-[0_0_15px_rgba(14,165,233,0.5)]');
                btn.classList.add('bg-white/5', 'text-slate-300', 'border-white/10');
            });
            
            const clickedBtn = document.getElementById('btn-' + grade);
            if (clickedBtn) {
                clickedBtn.classList.remove('bg-white/5', 'text-slate-300', 'border-white/10');
                clickedBtn.classList.add('bg-brand-blue', 'text-white', 'border-brand-blue', 'shadow-[0_0_15px_rgba(14,165,233,0.5)]');
            }

            const data = physicsData[grade];
            const contentArea = document.getElementById('content-area');
            
            let html = `
                <div class="fade-in mb-8">
                    <h2 class="text-3xl font-bold text-white border-b border-white/10 pb-4 inline-block pr-10">${data.title}</h2>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            `;

            data.topics.forEach((topic, index) => {
                const delay = index * 0.1; 
                
                // Проверяем, есть ли пример задачи для этой темы
                let exampleHtml = '';
                if (topic.example) {
                    exampleHtml = `
                        <div class="example-box mt-5 p-4 rounded-lg">
                            <h4 class="text-xs text-emerald-400 font-bold mb-3 uppercase tracking-wider flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                Пример решения задачи
                            </h4>
                            <div class="flex flex-col md:flex-row gap-4 text-sm font-mono text-slate-300">
                                <div class="md:w-1/3 border-b md:border-b-0 md:border-r border-white/10 pb-3 md:pb-0 pr-4">
                                    <p class="text-slate-500 mb-1">Дано:</p>
                                    <p class="leading-relaxed">${topic.example.dano}</p>
                                </div>
                                <div class="md:w-2/3">
                                    <p class="text-slate-500 mb-1">Решение:</p>
                                    <p class="leading-relaxed mb-3">${topic.example.sol}</p>
                                    <p class="text-brand-blue font-bold bg-brand-blue/10 inline-block px-2 py-1 rounded">Ответ: ${topic.example.ans}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="glass-card rounded-2xl p-6 fade-in flex flex-col justify-between" style="animation-delay: ${delay}s">
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue font-bold shadow-inner shrink-0">
                                    ${index + 1}
                                </div>
                                <h3 class="text-xl font-bold text-white">${topic.name}</h3>
                            </div>
                            
                            <p class="text-slate-400 mb-5 text-sm leading-relaxed">
                                ${topic.desc}
                            </p>
                            
                            <div class="formula-box p-4 rounded-lg">
                                <span class="text-xs text-brand-blue uppercase font-bold tracking-wider mb-1 block">Формула</span>
                                <code class="font-mono text-xl text-emerald-400 block mb-3">${topic.formula}</code>
                                <p class="font-mono text-xs text-slate-500 border-t border-white/5 pt-2">
                                    ${topic.vars}
                                </p>
                            </div>
                        </div>
                        
                        ${exampleHtml}
                    </div>
                `;
            });

            html += `</div>`;
            contentArea.innerHTML = html;
        }
    </script>
</body>
</html>
